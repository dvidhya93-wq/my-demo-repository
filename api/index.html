<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Swagger UI</title>

  <link rel="stylesheet"
    href="https://unpkg.com/swagger-ui-dist/swagger-ui.css">

  <style>
    body {
      margin: 0;
      padding: 0;
    }
  </style>
  <style>
.topbar {
    display: none;
}

.swagger-ui .info hgroup.main h2 {
    color: #2563eb;
}
</style>
</head>

<body>

<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>

<script>
window.onload = () => {
  SwaggerUIBundle({
    url: "./openapi.yaml",
    dom_id: '#swagger-ui'
  });
};
</script>

</body>
</html>
